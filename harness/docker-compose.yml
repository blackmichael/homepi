services:
  paseo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: paseo
    restart: unless-stopped

    ports:
      - "127.0.0.1:6767:6767"
      - "127.0.0.1:3333:3333"

    environment:
      PASEO_PASSWORD: "${PASEO_PASSWORD}"
      PASEO_HOSTNAMES: "${PASEO_HOSTNAMES}"
      GH_TOKEN: "${GH_TOKEN}"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: "user.name"
      GIT_CONFIG_VALUE_0: "Michael Black"
      GIT_CONFIG_KEY_1: "user.email"
      GIT_CONFIG_VALUE_1: "michaelpblack16@gmail.com"
      PASEO_LOG_LEVEL: "warn"
    volumes:
      # SSH identity and host keys used by agents for GitHub.
      - /mnt/data/dev/ssh/id_ed25519:/home/paseo/.ssh/id_ed25519:ro
      - /mnt/data/dev/paseo/home/.ssh/known_hosts:/home/paseo/.ssh/known_hosts:ro

      # Repositories Paseo/OMP may read and modify.
      - /mnt/data/dev/projects:/workspace
      - /mnt/data/dev/homepi:/workspace/homepi

      # Paseo state, OMP config/credentials, and worktrees.
      - /mnt/data/dev/paseo/home:/home/paseo

    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 512

    tmpfs:
      - /tmp:size=512m

    security_opt:
      - no-new-privileges:true
