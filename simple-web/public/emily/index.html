<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite Sisterwives</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #ffd1e3;
      color: #3d1728;
      box-sizing: border-box;
    }

    *, *::before, *::after { box-sizing: inherit; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffb3d0, #ffd1e3 65%);
    }

    main {
      width: min(88vw, 620px);
      margin: 2rem 0;
      padding: clamp(1.25rem, 6vw, 2.5rem);
      text-align: center;
      border: 2px solid #c23b72;
      border-radius: 18px;
      background: #fff0f6eF;
      box-shadow: 8px 8px 0 #9e315d;
    }

    h1 {
      margin: 0 0 0.4rem;
      color: #a51f58;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    p { color: #71334e; }

    img {
      display: block;
      width: min(100%, 420px);
      margin: 1.5rem auto;
      border: 5px solid #fff7fa;
      border-radius: 12px;
    }

    marquee {
      margin: 1rem 0;
      padding: 0.65rem;
      color: #3d1728;
      background: #ff8fba;
      border-radius: 999px;
      font-weight: 700;
    }

    details {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      text-align: left;
      border: 1px dashed #c23b72;
      border-radius: 10px;
    }

    summary { cursor: pointer; color: #a51f58; }
    small { display: block; margin-top: 1.5rem; color: #9a5471; }

    @media (max-width: 480px) {
      body { place-items: start center; }

      main {
        width: calc(100vw - 1.5rem);
        margin: 0.75rem 0;
        border-radius: 12px;
        box-shadow: 4px 4px 0 #9e315d;
      }

      img { margin: 1rem auto; }
      marquee { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Emily and Louisa are my favorite sisterwives</h1>
    </header>

    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXZtNmxiemYwOXNsM3d3Y3Z1anQ2Y212enhqbHdlMDJvc2RuYnp2biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Nx0rz3jtxtEre/giphy.gif" alt="A friendly animated hello">

    <img src="https://upload.wikimedia.org/wikipedia/commons/0/07/The_Horse_in_Motion-anim.gif" alt="A running horse meme">

    <marquee direction="right" scrollamount="2" scrolldelay="25" truespeed>Marquee test: operating normally</marquee>

    <details>
      <summary>Tap to reveal</summary>
      <p id="fact" aria-live="polite">Loading a random fact...</p>
    </details>

    <small>☕ Powered by static HTML</small>
  </main>

  <script>
    const fact = document.querySelector('#fact');
    const fallback = 'In 1919, a giant storage tank in Boston burst and sent a wave of molasses through the streets.';

    fetch('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en')
      .then(response => {
        if (!response.ok) throw new Error('Fact request failed');
        return response.json();
      })
      .then(data => {
        fact.textContent = data.text || fallback;
      })
      .catch(() => {
        fact.textContent = fallback;
      });
  </script>
</body>
</html>
